# Qwen3.5-4B SFT evaluation on 1,500 test set
# Phase 4C: Post-SFT evaluation (baseline summarization with finetuned model)
experiment_name: "qwen3_5_4b_sft"
model_config: "models/qwen3_5_4b_sft.yaml"
prompt_config: "prompts/baseline.yaml"

data:
  data_dir: "data/processed/mimic_iv_bhc"
  ranges: ["0_1k", "1k_2k", "2k_4k"]
  sample_size: 500
  sample_seed: 42

generation:
  save_every: 10

output:
  dir: "outputs/baseline/qwen3_5_4b_sft/"
  predictions_file: "predictions.jsonl"
